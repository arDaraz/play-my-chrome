name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run static checks
        run: /bin/bash tests/lint.sh

  verify:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked development dependencies
        run: npm ci --ignore-scripts

      - name: Run macOS behavior and standard checks
        run: |
          /bin/bash tests/run.sh
          python3 tests/validate_skill.py

      - name: Smoke-test setup and the real locked Puppeteer
        run: |
          smoke_root="$(mktemp -d)"
          chmod 700 "$smoke_root"
          export PLAY_MY_CHROME_RUNTIME_DIR="$smoke_root/runtime"
          export PLAY_MY_CHROME_NODE="$(command -v node)"
          wrapper="$GITHUB_WORKSPACE/skills/play-my-chrome/scripts/play-my-chrome.sh"
          "$wrapper" setup
          node --input-type=module -e '
            const {installedPuppeteer} = await import(process.argv[1]);
            const puppeteer = installedPuppeteer(process.env.PLAY_MY_CHROME_RUNTIME_DIR);
            if (typeof puppeteer.connect !== "function") throw new Error("Puppeteer connect is missing");
          ' "$GITHUB_WORKSPACE/skills/play-my-chrome/scripts/runtime.mjs"

      - name: Verify Vercel Skills discovery
        run: |
          output="$(node_modules/.bin/skills install . --list)"
          printf '%s\n' "$output"
          grep -F "play-my-chrome" <<<"$output"

      - name: Verify vendor, universal, and wildcard agent installation
        env:
          SOURCE_REPOSITORY: ${{ github.workspace }}
        run: |
          install_root="$(mktemp -d)"
          skills_cli="$SOURCE_REPOSITORY/node_modules/.bin/skills"
          mkdir \
            "$install_root/vendors" \
            "$install_root/universal" \
            "$install_root/wildcard"
          cd "$install_root/vendors"
          "$skills_cli" install "$SOURCE_REPOSITORY" \
            --skill play-my-chrome \
            --agent codex \
            --agent claude-code \
            --copy \
            --yes
          test -f .agents/skills/play-my-chrome/SKILL.md
          test -f .claude/skills/play-my-chrome/SKILL.md
          test -f .agents/skills/play-my-chrome/LICENSE
          test -f .claude/skills/play-my-chrome/LICENSE
          test -x .agents/skills/play-my-chrome/scripts/play-my-chrome.sh
          test -x .claude/skills/play-my-chrome/scripts/play-my-chrome.sh
          test -f .agents/skills/play-my-chrome/scripts/session.mjs
          test -f .agents/skills/play-my-chrome/cli/package.json
          test -f .claude/skills/play-my-chrome/cli/package-lock.json
          cd "$install_root/universal"
          "$skills_cli" install "$SOURCE_REPOSITORY" \
            --skill play-my-chrome \
            --agent universal \
            --copy \
            --yes
          test -f .agents/skills/play-my-chrome/SKILL.md
          test -f .agents/skills/play-my-chrome/LICENSE
          test -x .agents/skills/play-my-chrome/scripts/play-my-chrome.sh
          cd "$install_root/wildcard"
          "$skills_cli" install "$SOURCE_REPOSITORY" \
            --skill play-my-chrome \
            --agent '*' \
            --copy \
            --yes
          test -f .agents/skills/play-my-chrome/SKILL.md
          test -f .agents/skills/play-my-chrome/LICENSE
          test -x .agents/skills/play-my-chrome/scripts/play-my-chrome.sh
